<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DAYCER × CUSHION · Tokenomics Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
<script src="https://unpkg.com/recharts@2.15.4/umd/Recharts.js"></script>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.9/babel.min.js"></script>
<style>
:root{color-scheme:dark}body{margin:0;background:#0F172A;color:#e9eff9;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif}body:before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 15% 10%,#10b9810c,transparent 42%),radial-gradient(ellipse at 87% 35%,#3b82f60c,transparent 45%)}.glass{background:linear-gradient(135deg,rgba(30,45,66,.72),rgba(17,29,47,.82));border:1px solid #ffffff0e;backdrop-filter:blur(20px)}.mono{font-variant-numeric:tabular-nums;letter-spacing:-.035em}.eyebrow{font-size:10px;letter-spacing:.18em;font-weight:600;color:#8193ae}.muted{color:#8fa0b9}.glow{box-shadow:0 0 42px #10b9810a}.price{background:linear-gradient(120deg,#fff,#6ee7b7);background-clip:text;-webkit-text-fill-color:transparent}input[type=range]{appearance:none;height:5px;border-radius:9px;width:100%;cursor:pointer}input[type=range]::-webkit-slider-thumb{appearance:none;width:19px;height:19px;background:#10b981;border:4px solid #c1ffea;border-radius:50%;box-shadow:0 0 20px #10b98170}input[type=range]::-moz-range-thumb{width:13px;height:13px;background:#10b981;border:3px solid #c1ffea;border-radius:50%}button{transition:all .18s}button:hover{filter:brightness(1.2)}button:focus-visible,input:focus-visible{outline:2px solid #60a5fa;outline-offset:5px}.recharts-default-tooltip{border-radius:12px}.icon svg{width:18px;height:18px}.thin-grid{background-image:linear-gradient(#ffffff02 1px,transparent 1px),linear-gradient(90deg,#ffffff02 1px,transparent 1px);background-size:28px 28px}@media print{body{background:white;color:#172033}.glass{background:white;border:1px solid #cbd5e1}.muted,.eyebrow{color:#475569}.no-print{display:none}.price{-webkit-text-fill-color:#059669}main{padding:10px!important}.chart-card{break-inside:avoid}}
</style></head><body><div id="root"><p style="padding:40px">대시보드 로딩 중… 인터넷 연결이 필요합니다.</p></div>
<script type="text/babel">
const {useState,useEffect}=React;
const {ResponsiveContainer,ComposedChart,Bar,Line,XAxis,YAxis,CartesianGrid,Tooltip}=Recharts;
// Allocation quantities are the supplied rounded integers. Market-price edits never alter allocations.
const PRINCIPAL=5000000000, BASE_PRICE=3.9;
const DATA=[615384615,307692308,153846154,76923077,38461538].map((coins,i)=>({year:i+1,label:`${i+1}년차`,period:`${2026+i}.12 — ${2027+i}.11`,rate:48/2**i,coins}));
const TOTAL=DATA.reduce((s,d)=>s+d.coins,0);
const num=n=>new Intl.NumberFormat('ko-KR',{maximumFractionDigits:0}).format(n);
const eok=n=>(n/1e8).toLocaleString('ko-KR',{minimumFractionDigits:2,maximumFractionDigits:2});
function Icon({name,className=''}){return <span className={'icon inline-flex '+className} aria-hidden="true"><i data-lucide={name}/></span>}
function App(){
 const [price,setPrice]=useState(3.9),[view,setView]=useState('annual');
 useEffect(()=>{lucide.createIcons()},[]);
 const rows=DATA.map((d,i)=>({...d,value:d.coins*price,cumulative:DATA.slice(0,i+1).reduce((s,r)=>s+r.coins,0)}));
 const chart=rows.map(d=>({...d,plotCoins:(view==='annual'?d.coins:d.cumulative)/1e8,plotValue:(view==='annual'?d.value:d.cumulative*price)/1e8}));
 function csv(){const data='\uFEFF'+[['연차','적용기간','기준배정률(%)','연간코인(개)','누적코인(개)','가정단가(원)','연간평가액(원)'],...rows.map(d=>[d.year,d.period,d.rate,d.coins,d.cumulative,price,d.value.toFixed(2)])].map(r=>r.join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([data],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='DAYCER_CUSHION_Scenario.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
 return <div className="relative min-h-screen">
 <header className="border-b border-white/5"><div className="max-w-[1440px] mx-auto px-5 md:px-10 h-20 flex items-center justify-between gap-4"><div className="flex items-center gap-3"><div className="w-9 h-9 rounded-xl bg-emerald-400/10 border border-emerald-400/30 flex items-center justify-center text-emerald-300"><Icon name="layers"/></div><div><div className="font-bold text-sm tracking-[.12em]">DAYCER <span className="text-slate-600 mx-1">×</span> CUSHION</div><div className="eyebrow mt-1 !text-[8px]">TOKENOMICS STUDIO</div></div></div><div className="flex items-center gap-5"><span className="hidden md:block text-xs muted">Investor workspace</span><span className="rounded-full border border-blue-400/20 bg-blue-400/5 text-blue-300 text-[10px] px-3 py-1.5 tracking-wider">SIMULATION / v1.0</span></div></div></header>
 <main className="max-w-[1440px] mx-auto px-5 md:px-10 py-9">
 <section className="flex flex-wrap justify-between items-end gap-6 mb-8"><div><div className="eyebrow text-emerald-400 mb-3">LESS EMISSION. MORE PERSPECTIVE.</div><h1 className="text-3xl md:text-[40px] font-semibold tracking-tight leading-tight">리워드의 흐름을, 한눈에.</h1><p className="muted text-sm mt-3">48%에서 시작하는 연간 반감기. 나만의 가격 시나리오를 설계하세요.</p></div><div className="flex items-center gap-3 text-xs muted"><Icon name="calendar-days"/><span>2026.12 <span className="mx-2 text-slate-600">→</span> 2031.11 <span className="ml-2 text-white">60개월</span></span></div></section>
 <section className="grid md:grid-cols-3 gap-4 mb-6" aria-label="리워드 요약">
 {[{label:'1년차 수령 코인',value:num(DATA[0].coins),unit:'CUSHION',bottom:'2026.12 — 2027.11',tag:'48% 기준 배정',icon:'coins'},{label:'5년 누적 수령 코인',value:num(TOTAL),unit:'CUSHION',bottom:'5개 리워드 구간의 합계',tag:'총 93% 기준 배정',icon:'layers'},{label:'5년 누적 코인 원화 가치',value:eok(TOTAL*price),unit:'억 원',bottom:`가정 단가 ₩${price.toFixed(2)} · 원금 제외`,tag:'실시간 시나리오',icon:'chart-no-axes-combined'}].map((k,i)=><div key={k.label} className={'glass rounded-2xl p-6 relative overflow-hidden '+(i===2?'!border-emerald-400/25 glow':'')}><div className="flex justify-between items-center"><span className="text-xs muted">{k.label}</span><Icon name={k.icon} className={i===2?'text-emerald-400':'text-slate-500'}/></div><div className={'mono mt-5 text-[29px] lg:text-[34px] font-semibold '+(i===2?'text-emerald-300':'text-white')} data-testid={'kpi-'+i}>{k.value}<span className="text-[10px] ml-2 tracking-normal text-slate-400 font-medium">{k.unit}</span></div><div className="flex justify-between flex-wrap gap-2 mt-4 text-[10px]"><span className="muted">{k.bottom}</span><span className={i===2?'text-emerald-400':'text-blue-300'}>{k.tag}</span></div></div>)}
 </section>
 <section className="grid lg:grid-cols-[310px_1fr] gap-6 mb-6">
 <aside className="glass rounded-2xl p-6"><div className="flex items-center justify-between"><h2 className="text-sm font-semibold">시나리오 설정</h2><button className="text-slate-400 no-print p-1" onClick={()=>setPrice(3.9)} aria-label="기본 단가로 초기화" title="기본값으로 초기화"><Icon name="rotate-ccw"/></button></div><div className="mt-6 p-4 bg-slate-950/30 rounded-xl border border-white/5 flex justify-between items-center"><span className="text-xs muted">기준 투자금</span><span className="mono text-lg font-semibold">50<span className="text-xs ml-1 muted">억 원</span></span></div>
 <div className="mt-7"><label htmlFor="coin-price" className="text-xs muted">코인 예상 단가</label><div className="flex items-end gap-3 mt-2"><span className="price text-5xl font-semibold mono" data-testid="price">₩{price.toFixed(2)}</span><span className="muted text-xs mb-2">≈ ${(price/1300).toFixed(4)}</span></div><div className="mt-7"><input id="coin-price" aria-valuetext={`${price.toFixed(2)}원`} type="range" min="1" max="20" step="0.1" value={price} onChange={e=>setPrice(Number(e.target.value))} style={{background:`linear-gradient(to right,#10B981 ${(price-1)/19*100}%,#334155 ${(price-1)/19*100}%)`}}/><div className="flex justify-between text-[10px] muted mt-2"><span>₩1.00</span><span>₩20.00</span></div></div><div className="grid grid-cols-5 gap-1.5 mt-5">{[1,3.9,5,10,20].map(p=><button key={p} aria-pressed={price===p} onClick={()=>setPrice(p)} className={'py-2 text-[11px] rounded-lg border '+(price===p?'border-emerald-400/50 bg-emerald-400/10 text-emerald-300':'border-white/5 bg-white/[.03] text-slate-400')}>{p}원</button>)}</div></div>
 <div className="mt-7 pt-5 border-t border-white/5 space-y-3 text-xs"><div className="flex justify-between"><span className="muted">배정 기준 단가</span><span>₩3.90 <span className="muted">/ 고정</span></span></div><div className="flex justify-between"><span className="muted">반감기 주기</span><span>12개월</span></div><div className="flex justify-between"><span className="muted">기준 단가 대비</span><span className="text-blue-300 mono">{(price/3.9).toFixed(2)}×</span></div></div><p className="mt-5 text-[10px] leading-relaxed text-slate-500">가격을 변경해도 배정 코인 수량은 동일합니다.<br/>USD 표시는 1달러 = 1,300원 가정입니다.</p>
 </aside>
 <div className="glass rounded-2xl p-5 md:p-7 chart-card min-w-0"><div className="flex justify-between flex-wrap gap-4"><div><div className="eyebrow mb-2">REWARD PROJECTION</div><h2 className="text-lg font-semibold">반감기와 가치의 궤적</h2></div><div className="flex bg-slate-950/35 p-1 rounded-lg h-9 text-xs">{[['annual','연간'],['cumulative','누적']].map(([v,l])=><button key={v} onClick={()=>setView(v)} aria-pressed={view===v} className={'px-4 rounded-md '+(view===v?'bg-slate-700 text-white shadow':'text-slate-400')}>{l}</button>)}</div></div><div className="flex gap-5 mt-5 text-[10px] muted"><span><span className="inline-block w-2 h-2 bg-emerald-400 rounded-sm mr-2"/>코인 수량 · 억 개</span><span><span className="inline-block w-4 h-0.5 bg-blue-400 mr-2 align-middle"/>원화 가치 · 억 원</span></div>
 <div className="h-[310px] md:h-[340px] mt-5 w-full" role="img" aria-label={`${view==='annual'?'연간':'누적'} 코인 수량과 원화 평가액 차트. 정확한 값은 아래 표에서 확인할 수 있습니다.`}><ResponsiveContainer width="100%" height="100%"><ComposedChart data={chart} margin={{top:15,right:0,left:-16,bottom:0}}><defs><linearGradient id="bars" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#34d399" stopOpacity=".95"/><stop offset="100%" stopColor="#10b981" stopOpacity=".2"/></linearGradient><filter id="lineglow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><CartesianGrid stroke="#ffffff09" vertical={false}/><XAxis dataKey="label" axisLine={false} tickLine={false} tick={{fill:'#8292aa',fontSize:11}} dy={8}/><YAxis yAxisId="coins" axisLine={false} tickLine={false} tick={{fill:'#668b85',fontSize:10}} tickFormatter={n=>n.toFixed(1)}/><YAxis yAxisId="value" orientation="right" axisLine={false} tickLine={false} tick={{fill:'#7195c7',fontSize:10}} tickFormatter={n=>n.toFixed(1)}/><Tooltip cursor={{fill:'#ffffff04'}} content={({active,payload})=>{if(!active||!payload?.length)return null;const d=payload[0].payload;return <div className="rounded-xl border border-slate-600 bg-slate-900 p-4 shadow-xl text-xs"><p className="text-slate-400 mb-3">{d.period} · {d.rate}%</p><p className="text-emerald-300">{num(view==='annual'?d.coins:d.cumulative)} CUSHION</p><p className="text-blue-300 mt-2">{d.plotValue.toFixed(2)}억 원</p></div>}}/><Bar yAxisId="coins" dataKey="plotCoins" fill="url(#bars)" radius={[6,6,0,0]} maxBarSize={62} isAnimationActive={false}/><Line yAxisId="value" dataKey="plotValue" type="monotone" stroke="#60a5fa" strokeWidth={3} dot={{fill:'#0f172a',stroke:'#60a5fa',strokeWidth:3,r:4}} activeDot={{r:6}} isAnimationActive={false} filter="url(#lineglow)"/></ComposedChart></ResponsiveContainer></div><div className="flex items-center gap-2 text-[10px] muted mt-4 border-t border-white/5 pt-4"><Icon name="info"/><span>막대는 코인 수량, 선은 입력한 단가 기준 가치입니다. 좌우 축의 단위가 다릅니다.</span></div>
 </div></section>
 <section className="glass rounded-2xl overflow-hidden"><div className="p-6 flex justify-between items-center gap-3"><div><div className="eyebrow mb-2">ALLOCATION SCHEDULE</div><h2 className="text-lg font-semibold">5년 리워드 상세</h2></div><button onClick={csv} className="no-print flex items-center gap-2 px-3 py-2 rounded-lg border border-white/10 text-xs text-slate-300"><Icon name="download"/>CSV 저장</button></div><div className="overflow-x-auto"><table className="w-full text-sm whitespace-nowrap"><thead className="bg-slate-950/25 text-[10px] muted"><tr>{['리워드 구간','기준 배정률','연간 수령 코인','누적 수령 코인','연간 원화 가치'].map((s,i)=><th key={s} className={'px-6 py-3 font-medium '+(i?'text-right':'text-left')}>{s}</th>)}</tr></thead><tbody>{rows.map((d,i)=><tr key={d.year} className="border-b border-white/5 hover:bg-white/[.02]"><td className="px-6 py-4"><div className="flex items-center gap-3"><span className="mono text-[10px] text-slate-500 border border-white/10 rounded-lg p-2">0{d.year}</span><div className="text-xs">{d.label}<div className="text-[10px] muted mt-1">{d.period}</div></div></div></td><td className="px-6 py-4 text-right"><span className="inline-flex rounded-md px-2 py-1 bg-emerald-400/10 text-emerald-300 text-xs mono">{d.rate}%</span></td><td className="px-6 py-4 text-right mono">{num(d.coins)}<span className="text-[10px] muted ml-1">개</span></td><td className="px-6 py-4 text-right mono text-slate-400">{num(d.cumulative)}</td><td className="px-6 py-4 text-right mono text-blue-300">{eok(d.value)}<span className="text-[10px] ml-1">억 원</span></td></tr>)}</tbody><tfoot className="bg-emerald-400/[.04]"><tr className="font-semibold"><td className="px-6 py-5 text-xs">5년 합계</td><td className="px-6 py-5 text-right text-emerald-300">93%</td><td className="px-6 py-5 text-right mono">{num(TOTAL)}</td><td className="px-6 py-5 text-right text-slate-500">—</td><td className="px-6 py-5 text-right text-emerald-300 mono">{eok(TOTAL*price)}<span className="text-[10px] ml-1">억 원</span></td></tr></tfoot></table></div></section>
 <footer className="mt-6 grid md:grid-cols-[1fr_auto] gap-5 text-[10px] leading-relaxed text-slate-500"><div><p>계산식: 연간 배정 코인 ≈ 50억 원 × 해당 연차 배정률 ÷ 3.9원. 표시 수량은 제공된 정수 배정표를 적용합니다.</p><p className="mt-1">48% → 24% → 12% → 6% → 3%는 코인 배정 기준입니다. 원화 가치는 가정 단가에 따른 평가액이며 확정 현금 이자가 아닙니다. 기존 24% 이자·원금·재투자·세금·수수료는 합산하지 않습니다.</p></div><span className="eyebrow !text-[9px]">DAYCER × CUSHION<br/><span className="block mt-1 text-right">DESIGNED FOR CLARITY</span></span></footer>
 </main></div>
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
